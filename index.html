<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedVoice | Simple Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --morning: #ffbe0b; --evening: #3a86ff; --danger: #ff006e; --bg: #f8f9fa; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        
        .header { margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin: 0; color: #2d3436; }
        .header p { color: #636e72; font-weight: 600; }

        .med-card {
            background: white;
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            border: 4px solid transparent;
        }
        .med-card:active { transform: scale(0.95); }
        
        .morning { border-color: var(--morning); }
        .evening { border-color: var(--evening); }

        .icon { font-size: 80px; margin-bottom: 10px; }
        .label { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; }

        /* Simple AI Assistant */
        #ai-trigger {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d3436;
            color: white;
            padding: 20px 40px;
            border-radius: 50px;
            font-weight: 800;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        #ai-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .ai-status { font-size: 1.2rem; color: var(--danger); font-weight: 800; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h1>MedVoice</h1>
    <p>Tap an icon to hear your instructions</p>
</div>

<div class="med-card morning" onclick="speak('Take one white pill for your heart with your breakfast.')">
    <div class="icon">☀️</div>
    <div class="label" style="color: var(--morning)">Morning / الصباح</div>
</div>

<div class="med-card evening" onclick="speak('Take two small pills for sleep before you go to bed.')">
    <div class="icon">🌙</div>
    <div class="label" style="color: var(--evening)">Evening / المساء</div>
</div>

<button id="ai-trigger" onclick="startAI()">🎙️ ASK AI ASSISTANT</button>

<div id="ai-overlay">
    <div style="font-size: 100px;">🤖</div>
    <div id="ai-text" style="font-size: 1.5rem; font-weight: 700; margin-top: 20px;">Listening to your question...</div>
    <div class="ai-status" id="ai-status">WAVEFORM ACTIVE</div>
    <button onclick="stopAI()" style="margin-top: 40px; padding: 15px 30px; border-radius: 20px; border: none; background: #eee; font-weight: 700;">CLOSE</button>
</div>

<script>
    // 1. VOICE LOGIC (The "Accessibility" part)
    function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9; // Slower for elderly
        window.speechSynthesis.speak(utterance);
    }

    // 2. AI LOGIC (The "Hackathon" part)
    function startAI() {
        document.getElementById('ai-overlay').style.display = 'flex';
        // In a real app, we would use Web Speech API here.
        // For the prototype, we simulate the AI "Thinking"
        setTimeout(() => {
            document.getElementById('ai-text').innerText = "AI Analysis: You asked about your blood pressure medicine. You should take it every morning at 8 AM.";
            speak("You should take your blood pressure medicine every morning at 8 AM.");
            document.getElementById('ai-status').innerText = "ADVICE GENERATED";
            document.getElementById('ai-status').style.color = "#2a9d8f";
        }, 2000);
    }

    function stopAI() {
        document.getElementById('ai-overlay').style.display = 'none';
        document.getElementById('ai-text').innerText = "Listening to your question...";
        document.getElementById('ai-status').innerText = "WAVEFORM ACTIVE";
        document.getElementById('ai-status').style.color = "var(--danger)";
        window.speechSynthesis.cancel();
    }
</script>

</body>
</html>
