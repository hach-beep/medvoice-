<head>

}

<body>

    <div id="waiting">

        <button onclick="window.location.href='file.html'" style="margin-top:20px; background:none; border:1px solid white; color:white; padding:10px 20px; border-radius:50px; cursor:pointer;">
    VIEW MY MEDICATIONS / عرض الأدوية
        </button>
        <button onclick="start()" id="start-btn" style="padding:20px 40px; border-radius:50px; border:none; background:#2a9d8f; color:white; font-weight:800; font-size: 1.2rem;">START MONITORING</button>
    </div>

    <div id="alert">
        <h1 style="font-size: 2.5rem; color: #d63031; margin: 0;">TIME FOR MEDICINE!</h1>
        <img id="med-img" src="">

        <button class="btn-stop" onclick="stopAlert()">I TOOK IT / تم الأخذ</button>

<div id="patient-file" style="display: none; padding: 20px; background: #f9f9f9; color: #333; min-height: 100vh; text-align: left;">
    <button onclick="closeFile()" style="background: #eee; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; margin-bottom: 20px;">← BACK</button>

    <div id="med-list-container"
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyASth7cdm0Pr2wvORbyXwQ19LkSNoJMR0E",
        authDomain: "medvoice-8d2e0.firebaseapp.com",
        projectId: "medvoice-8d2e0",
        storageBucket: "medvoice-8d2e0.firebasestorage.app",
        messagingSenderId: "644370066289",
        appId: "1:644370066289:web:3f92c01653711151f4e4d0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let meds = [];
    let alertInterval;
// --- BACKGROUND & AWAKE SETTINGS ---
let wakeLock = null;

// Function to keep the screen from sleeping
async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('Wake Lock Active');
        }
    } catch (err) { console.log('Wake Lock Error: ' + err.message); }
}

// 1. Silent Heartbeat to prevent app from "freezing"
const silentAudio = new Audio("https://github.com/anars/blank-audio/blob/master/10-seconds-of-silence.mp3?raw=true");
silentAudio.loop = true;

function start() {
    // A. Start technical "Stay Awake" logic
    requestWakeLock();
    silentAudio.play().catch(e => console.log("Audio play blocked until interaction"));

    // B. UI Updates
    document.getElementById('start-btn').style.display = "none";
    document.getElementById('status-text').innerText = "System active. Monitoring schedule...";
    speak("System active. I will remind you when it is time for your medicine.");

    // C. Connect to Cloud (Only once!)
    db.collection("meds").onSnapshot((snapshot) => {
        meds = [];
        sna

    function checkTime() {
    const now = new Date();
    const currentTime = now.getHours().toString().padStart(2, '0') + ":" + 
                        now.getMinutes().toString().padStart(2, '0');
    
    const todayDate = now.toISOString().split('T')[0];
    const todayDay = now.getDay(); // Sunday is 0, Monday is 1...

    meds.forEach(m => {
        // 1. Is the time right?
        const isTimeMatch = (m.time === currentTime);
        
        // 2. Is today one of the allowed days for this med?
        const isDayMatch = m.days && m.days.includes(todayDay);
        
        // 3. Is the date within the Start/End range?
        let isDateValid = true;
        if(m.startDate && todayDate < m.startDate) isDateValid = false;
        if(m.endDate && todayDate > m.endDate) isDateValid = false;

        if (isTimeMatch && isDayMatch && isDateValid && !m.isAlerting) {
            m.isAlerting = true;
            triggerAlert(m);
        }
    });
    }

    function triggerAlert(m) {
    const alertScreen = document.getElementById('alert');
    const medImg = document.getElementById('med-img');
    const medInfo = document.getElementById('med-info');

    medImg.src = m.photo;
    medInfo.innerText = m.name + " (" + (m.label || "") + ") - " + m.note;
    
    alertScreen.style.display = "block"; // Show the screen
    document.getElementById('waiting').style.display = "none"; // Hide waiting

    alertInterval = setInterval(() => {
        speak(`It is time for your ${m.name}. ${m.note}.`);
    }, 5000);
    }

    function stopAlert() {
        clearInterval(alertInterval);
        window.speechSynthesis.cancel();
        document.getElementById('alert').style.display = "none";
    }

    function speak(t) {
        const msg = new SpeechSynthesisUtterance(t);
        msg.rate = 0.7;
        window.speechSynthesis.speak(msg);
        function openFile() {
    document.getElementById('waiting').style.display = 'none';
    document.getElementById('patient-file').style.display = 'block';
    renderMedList();
}
    
async function deleteMed(index) {
    if(confirm("Are you sure you want to remove this medication from the file?")) {
        // 1. Remove from local array
        const medToDelete = meds[index];
        meds.splice(index, 1);
        renderMedList();
        alert("Medication removed.");
    }
}
    }
</script>
