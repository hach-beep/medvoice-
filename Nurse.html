<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedVoice | Nurse Portal</title>
    <!-- Firebase SDKs (Namespaced version for easy iPad use) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #1a2b48; --teal: #2a9d8f; --bg: #f4f7f6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 2px solid #eee; font-size: 1rem; }
        .btn { width: 100%; padding: 18px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; margin-top: 10px; }
        #photo-preview { width: 100%; height: 200px; background: #eee; border-radius: 15px; object-fit: cover; margin: 10px 0; border: 2px dashed #ccc; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="color:var(--navy); margin-top:0;">MedVoice <span style="color:var(--teal)">Setup</span></h1>
    
    <label>1. Take Photo of Medicine</label>
    <input type="file" id="med-photo" accept="image/*" capture="camera">
    <img id="photo-preview" src="">

    <label>2. Medication Name</label>
    <input type="text" id="med-name" placeholder="e.g. Heart Pill">

    <label>3. Time to Take</label>
    <input type="time" id="med-time">

    <label>4. Instructions</label>
    <input type="text" id="med-note" placeholder="e.g. Take 1 pill after breakfast">

    <button class="btn" style="background:var(--navy); color:white" onclick="saveMed()">SAVE TO CLOUD</button>
    <button class="btn" style="background:var(--teal); color:white" onclick="window.location.href='patient.html'">GO TO PATIENT MODE</button>
</div>

<script>
    // YOUR SPECIFIC CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyASth7cdm0Pr2wvORbyXwQ19LkSNoJMR0E",
        authDomain: "medvoice-8d2e0.firebaseapp.com",
        projectId: "medvoice-8d2e0",
        storageBucket: "medvoice-8d2e0.firebasestorage.app",
        messagingSenderId: "644370066289",
        appId: "1:644370066289:web:3f92c01653711151f4e4d0"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Handle Photo Preview
    document.getElementById('med-photo').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = function() {
            const img = document.getElementById('photo-preview');
            img.src = reader.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };
    //handle the picture zise 
    function compressImage(base64Str) {
    return new Promise((resolve) => {
        const img = new Image();
        img.src = base64Str;
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 400; // Small size for fast, free upload
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.7)); // 0.7 quality
        };
    });
    }

    async function saveMed() {
        const name = document.getElementById('med-name').value;
        const time = document.getElementById('med-time').value;
        const note = document.getElementById('med-note').value;
        const photo = document.getElementById('photo-preview').src;

        if(!name || !time || !photo) return alert("Please fill all fields and take a photo");

        try {
            await db.collection("meds").add({
                name, time, note, photo,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Medication Synced Successfully!");
            location.reload();
        } catch (e) {
            alert("Error: " + e.message);
        }
    }
</script>
</body>
</html>
