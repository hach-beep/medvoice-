<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedVoice | Nurse Portal</title>
    <!-- Firebase SDKs (Namespaced version for easy iPad use) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
    :root {
        --navy: #1a2b48;
        --teal: #2a9d8f;
        --light-bg: #f8f9fa;
        --white: #ffffff;
        --text: #2d3436;
        --danger: #d63031;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: 'Inter', sans-serif;
        background-color: var(--light-bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        line-height: 1.6;
    }

    .container {
        max-width: 480px;
        margin: 0 auto;
        padding-bottom: 50px;
    }

    /* Modern Card Style */
    .card {
        background: var(--white);
        border-radius: 24px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(26, 43, 72, 0.05);
        border: 1px solid rgba(0,0,0,0.03);
        margin-bottom: 20px;
    }

    h1, h2 { color: var(--navy); font-weight: 800; letter-spacing: -0.5px; margin-top: 0; }

    /* Inputs */
    .input-group { margin-bottom: 20px; }
    label { display: block; font-weight: 700; font-size: 0.85rem; color: #636e72; margin-bottom: 8px; text-transform: uppercase; }
    
    input, select {
        width: 100%;
        padding: 15px;
        border-radius: 14px;
        border: 2px solid #edf2f7;
        background: #fdfdfd;
        font-size: 1rem;
        transition: 0.3s;
    }

    input:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 4px rgba(42, 157, 143, 0.1); }

    /* Modern Day Picker */
    #day-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .day-item { 
        background: #f1f2f6; padding: 10px; border-radius: 12px; font-size: 0.75rem; 
        font-weight: 700; text-align: center; cursor: pointer; display: block;
    }
    .day-item input { display: none; }
    .day-item:has(input:checked) { background: var(--navy); color: white; }

    /* Professional Buttons */
    .btn {
        width: 100%;
        padding: 18px;
        border-radius: 16px;
        border: none;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.3s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .btn-primary { background: var(--navy); color: var(--white); box-shadow: 0 10px 20px rgba(26, 43, 72, 0.2); }
    .btn-secondary { background: var(--teal); color: var(--white); margin-top: 12px; }
    .btn:active { transform: scale(0.97); }

    /* Photo Frame */
    #photo-preview {
        width: 100%;
        height: 220px;
        background: #f1f2f6;
        border-radius: 18px;
        object-fit: cover;
        margin: 10px 0;
        border: 2px dashed #cbd5e0;
        display: block;
    }
    </style>
</head>
<body>

<div class="card">
    <h1 style="color:var(--navy); margin-top:0;">MedVoice <span style="color:var(--teal)">Setup</span></h1>
    
    <label>Take Photo of Medicine</label>
    <input type="file" id="med-photo" accept="image/*" capture="camera">
    <img id="photo-preview" src="">

    <label>Medication Name</label>
    <input type="text" id="med-name" placeholder="e.g. Heart Pill">

    <label>Time to Take</label>
    <input type="time" id="med-time">
    <label>Select Day </label>
<div id="day-picker">
    <label class="day-item"><input type="checkbox" class="day-check" value="0"> SUN</label>
    <label class="day-item"><input type="checkbox" class="day-check" value="1"> MON</label>
    <label class="day-item"><input type="checkbox" class="day-check" value="2"> TUE</label>
    <label class="day-item"><input type="checkbox" class="day-check" value="3"> WED</label>
    <label class="day-item"><input type="checkbox" class="day-check" value="4"> THU</label>
    <label class="day-item"><input type="checkbox" class="day-check" value="5"> FRI</label>
    <label class="day-item"><input type="checkbox" class="day-check" value="6"> SAT</label>
</div>

<label>Duration</label>
<div style="display: flex; gap: 10px;">
    <input type="date" id="start-date" placeholder="Start">
    <input type="date" id="end-date" placeholder="End">
</div>
    <label>Dose Label</label>
<input type="text" id="med-label" placeholder="e.g. Morning Dose / جرعة الصباح">

    <label>Instructions</label>
    <input type="text" id="med-note" placeholder="e.g. Take 1 pill after breakfast">

    <button class="btn" style="background:var(--navy); color:white" onclick="saveMed()">SAVE TO CLOUD & DEVICE</button>
    <button class="btn" style="background:var(--teal); color:white; margin-top:10px;" onclick="window.location.href='patient.html'">GO TO PATIENT MODE</button>
    <button class="btn" style="background:#4a5568; color:white; margin-top:10px;" onclick="window.location.href='file.html'">VIEW MEDICATION RECORDS</button>
</div>

<script>
    // YOUR SPECIFIC CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyASth7cdm0Pr2wvORbyXwQ19LkSNoJMR0E",
        authDomain: "medvoice-8d2e0.firebaseapp.com",
        projectId: "medvoice-8d2e0",
        storageBucket: "medvoice-8d2e0.firebasestorage.app",
        messagingSenderId: "644370066289",
        appId: "1:644370066289:web:3f92c01653711151f4e4d0"
    };
    
    let db = null;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
    } catch (e) {
        console.warn("Firebase warning:", e);
    }

    // Handle Photo Preview
    document.getElementById('med-photo').onchange = function(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function() {
            const img = document.getElementById('photo-preview');
            img.src = reader.result;
        };
        reader.readAsDataURL(file);
    };
    //handle the picture zise 
    function compressImage(base64Str) {
        if (!base64Str || !base64Str.startsWith('data:image')) {
            return Promise.resolve('');
        }
        return new Promise((resolve) => {
            const img = new Image();
            img.src = base64Str;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400; // Small size for fast, free upload
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.7)); // 0.7 quality
            };
            img.onerror = () => resolve(base64Str);
        });
    }

    async function saveMed() {
        const name = document.getElementById('med-name').value.trim();
        const time = document.getElementById('med-time').value;
        const note = document.getElementById('med-note').value.trim();
        const label = document.getElementById('med-label')?.value.trim() || '';
        const rawPhoto = document.getElementById('photo-preview').src;
        const photo = await compressImage(rawPhoto);
        const start = document.getElementById('start-date').value;
        const end = document.getElementById('end-date').value;

        // Collect selected days (e.g., [0, 2, 4] for Sun, Tue, Thu)
        const selectedDays = [];
        document.querySelectorAll('.day-check:checked').forEach(cb => {
            selectedDays.push(parseInt(cb.value));
        });

        if(!name || !time || selectedDays.length === 0) {
            return alert("Please enter name, time, and at least one day.");
        }

        const medData = {
            id: 'med_' + Date.now(),
            name, time, note, label, photo,
            days: selectedDays, // Array of days
            startDate: start,
            endDate: end,
            isAlerting: false,
            createdAt: new Date().toISOString()
        };

        // Offline storage sync
        try {
            const saved = localStorage.getItem('medvoice_meds');
            const list = saved ? JSON.parse(saved) : [];
            list.push(medData);
            localStorage.setItem('medvoice_meds', JSON.stringify(list));
        } catch (e) {
            console.warn("Could not save to localStorage", e);
        }

        if (db) {
            try {
                const docRef = await db.collection("meds").add({
                    ...medData,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                medData.id = docRef.id;
            } catch (e) {
                console.warn("Firestore error (saved locally):", e.message);
            }
        }

        alert("Medication schedule saved and synced successfully!");
        location.reload();
    }
    
</script>
</body>
</html>
